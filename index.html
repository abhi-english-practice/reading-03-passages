const norm = (value) => String(value || '').normalize('NFKC').toLowerCase()
  .replace(/[‐‑‒–—]/g,'-').trim().replace(/\s+/g,' ');
function matches(q, answer) {
  const value = norm(answer);
  if (q.num === 1) return value.replace(/ /g,'') === '85dba';
  if (q.num === 2) return value.replace(/-/g,' ') === 'high frequency';
  return value === norm(q.answer);
}
function status(q) {
  if (q.num === 22) return 'discuss';
  const value = attempt().answers[q.num];
  return !norm(value) ? 'skipped' : matches(q,value) ? 'correct' : 'wrong';
}
function counts(questions) {
  const output = {correct:0,wrong:0,skipped:0,discuss:0};
  for (const q of questions) output[status(q)]++;
  return output;
}
function notify(message) {
  $('notice').textContent = message;
  $('notice').hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => $('notice').hidden = true, 2600);
}
function elapsed() {
  return attempt().elapsed + (clockStarted === null ? 0 : Date.now() - clockStarted);
}
function formatTime(milliseconds) {
  const seconds = Math.floor(milliseconds / 1000);
  return [Math.floor(seconds / 60),seconds % 60].map((value) => String(value).padStart(2,'0')).join(':');
}
function updateTime() {
  $('timer').textContent = formatTime(elapsed());
}
function pauseClock() {
  attempt().elapsed = elapsed();
  clockStarted = null;
}
function beginClock() {
  if (view === 'practice' && clockStarted === null && !document.hidden) clockStarted = Date.now();
}
setInterval(updateTime, 350);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseClock();
  } else {
    beginClock();
  }
});

function displayPane(nextPane) {
  pane = nextPane;
  $('workspace').dataset.pane = pane;
  for (const button of $('mobile').querySelectorAll('button')) {
    button.setAttribute('aria-pressed', button.dataset.pane === pane);
  }
}

function passageMarkup(text, i) {
  const entries = (attempt().marks[i] || []).map(([start,end]) => ({start,end,kind:'user'}));
  if (view === 'review') {
    const normalized = text.toLowerCase();
    for (const q of lesson().questions) {
      const start = normalized.indexOf(q.evidence.toLowerCase());
      if (start !== -1) entries.push({
        start,end:start + q.evidence.length,
        kind:q.context ? 'context' : 'evidence',
        current:q.num === evidenceNumber
      });
    }
  }
  const stops = [...new Set([0,text.length,...entries.flatMap(({start,end}) => [start,end])])].sort((a,b) => a-b);
  return stops.slice(0,-1).map((start,j) => {
    const end = stops[j+1];
    const segment = escape(text.slice(start,end));
    const covers = entries.filter((entry) => entry.start <= start && entry.end >= end);
    const selected = covers.find((entry) => entry.current) ||
      covers.find(({kind}) => kind === 'evidence') || covers.find(({kind}) => kind === 'context') || covers[0];
    return selected ? `<mark class="${selected.kind}${selected.current ? ' current' : ''}">${segment}</mark>` : segment;
  }).join('');
}
function renderPassage() {
  $('passage').innerHTML = lesson().paras.map((text,i) => {
    const tag = ['How they move','Coasting through history'].includes(text) ? 'h3' : 'p';
    return `<${tag} data-paragraph="${i}">${passageMarkup(text,i)}</${tag}>`;
  }).join('');
  $('clear-marks').disabled = !Object.values(attempt().marks).some((ranges) => ranges.length);
}
function showEvidence(n, forcePane = false) {
  const scroller = $('passage');
  const scroll = scroller.scrollTop;
  evidenceNumber = n;
  renderPassage();
  scroller.scrollTop = scroll;
  if (forcePane) displayPane('reading');
  const mark = scroller.querySelector('mark.current');
  if (mark && scroller.offsetWidth) scrollToChild(scroller,mark,40);
}
function scrollToChild(scroller, element, padding = 8) {
  scroller.scrollTop += element.getBoundingClientRect().top - scroller.getBoundingClientRect().top - padding;
}
function collectSelection() {
  const selection = getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
  const range = selection.getRangeAt(0);
  if (!$('passage').contains(range.startContainer) || !$('passage').contains(range.endContainer)) return null;
  const marks = [];
  for (const paragraph of $('passage').children) {
    if (!range.intersectsNode(paragraph)) continue;
    const part = document.createRange();
    part.selectNodeContents(paragraph);
    if (paragraph.contains(range.startContainer)) part.setEnd(range.startContainer,range.startOffset);
    else part.collapse(true);
    const start = part.toString().length;
    part.selectNodeContents(paragraph);
    if (paragraph.contains(range.endContainer)) part.setStart(range.endContainer,range.endOffset);
    else part.collapse(false);
    const end = paragraph.textContent.length - part.toString().length;
    if (end > start) marks.push([paragraph.dataset.paragraph,start,end]);
  }
  return marks.length ? marks : null;
}
function toggleMark() {
  const selected = collectSelection() || capturedSelection;
  capturedSelection = null;
  if (!selected) return notify('Select part of the passage to highlight.');
  for (const [i,start,end] of selected) {
    const existing = attempt().marks[i] || [];
    if (existing.some(([a,b]) => a <= start && b >= end)) {
      attempt().marks[i] = existing.flatMap(([a,b]) => b <= start || a >= end ? [[a,b]] :
        [...(a < start ? [[a,start]] : []), ...(b > end ? [[end,b]] : [])]);
      continue;
    }
    const combined = [];
    for (const [a,b] of [...existing,[start,end]].sort((a,b) => a[0]-b[0])) {
      const last = combined.at(-1);
      if (last && a <= last[1]) last[1] = Math.max(last[1],b);
      else combined.push([a,b]);
    }
    attempt().marks[i] = combined;
  }
  getSelection().removeAllRanges();
  const top = $('passage').scrollTop;
  renderPassage();
  $('passage').scrollTop = top;
}

const translationVisible = lessons.map(() => false);

function homeText(text, paragraph) {
  const spans = [];
  lesson().glossary.forEach(([phrase], i) => {
    const start = text.toLowerCase().indexOf(phrase.toLowerCase());
    if (start >= 0) spans.push({start,end:start + phrase.length,i});
  });
  spans.sort((a,b) => a.start-b.start || b.end-a.end);
  let cursor = 0;
  let html = '';
  for (const {start,end,i} of spans) {
    if (start < cursor) continue;
    html += escape(text.slice(cursor,start));
    html += `<button type="button" class="collocation" data-word="${i}" aria-expanded="false" aria-controls="meaning-${paragraph}">${escape(text.slice(start,end))}</button>`;
    cursor = end;
  }
  return html + escape(text.slice(cursor));
}
function setTranslationVisibility() {
  const show = translationVisible[index];
  const button = $('toggle-translation');
  button.setAttribute('aria-pressed',show);
  button.textContent = show ? 'Hide full Vietnamese translation' : 'Show full Vietnamese translation';
  for (const paragraph of $('home-passage').querySelectorAll('.paragraph-translation')) {
    paragraph.hidden = !show;
  }
}
function renderHome() {
  $('home-passage').innerHTML = lesson().paras.map((text,i) => {
    const tag = ['How they move','Coasting through history'].includes(text) ? 'h3' : 'p';
    return `<div class="home-paragraph">
      <${tag}>${homeText(text,i)}</${tag}>
      <div class="meaning-box" id="meaning-${i}" role="status" hidden></div>
      <div class="paragraph-translation" lang="vi" hidden>${escape(lesson().translation[i])}</div>
    </div>`;
  }).join('');
  setTranslationVisibility();
}
function closeMeaning() {
  const active = $('home-passage').querySelector('[aria-expanded=true]');
  if (!active) return null;
  active.setAttribute('aria-expanded','false');
  $(active.getAttribute('aria-controls')).hidden = true;
  return active;
}
$('home-passage').addEventListener('click', (event) => {
  const trigger = event.target.closest('[data-word]');
  if (!trigger) return;
  if (closeMeaning() === trigger) return;
  const [phrase,simple,vi] = lesson().glossary[Number(trigger.dataset.word)];
  const box = $(trigger.getAttribute('aria-controls'));
  box.innerHTML = `<b>${escape(phrase)}</b><p><span class="meaning-label">Simple English</span> ${escape(simple)}</p><p><span class="meaning-label">Vietnamese</span> <span lang="vi">${escape(vi)}</span></p>`;
  box.hidden = false;
  trigger.setAttribute('aria-expanded','true');
  if (box.getBoundingClientRect().bottom > window.innerHeight) box.scrollIntoView({block:'nearest'});
});
$('home').addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeMeaning()?.focus({preventScroll:true});
});
$('toggle-translation').addEventListener('click', () => {
  translationVisible[index] = !translationVisible[index];
  setTranslationVisibility();
});
$('go-home').addEventListener('click', () => {
  if (view === 'home') return;
  pauseClock();
  view = 'home';
  render();
});
$('go-practice').addEventListener('click', () => {
  if (view !== 'home') return;
  view = attempt().submitted ? 'result' : 'practice';
  displayPane('reading');
  evidenceNumber = null;
  render();
  beginClock();
});


function bankMarkup(items) {
  return `<div class="bank" lang="en">${items.map((item,i) => `<span><strong>${letters[i]}</strong>${escape(item)}</span>`).join('')}</div>`;
}
function field(q,type) {
  const value = attempt().answers[q.num] || '';
  const locked = view === 'review';
  const name = `aria-label="Answer for question ${q.num}" data-answer="${q.num}" ${locked ? 'disabled' : ''}`;
  const classes = locked ? status(q) : '';
  if (type === 'match' || type === 'bank') {
    const items = type === 'match' ? matching : wordBank;
    return `<select class="field ${classes}" ${name}><option value="">Select…</option>${items.map((item,i) =>
      `<option value="${letters[i]}" ${value === letters[i] ? 'selected' : ''}>${letters[i]} · ${escape(item)}</option>`).join('')}</select>`;
  }
  return `<input class="field ${classes}" ${name} value="${escape(value)}" placeholder="…" type="text" maxlength="80" spellcheck="false" autocomplete="off">`;
}
function choices(q,type) {
  const options = type === 'choice' ? q.options.map((o,i) => [letters[i],o[0]]) :
    (type === 'truth' ? ['TRUE','FALSE','NOT GIVEN'] : ['YES','NO','NOT GIVEN']).map((value) => [value,value]);
  const locked = view === 'review';
  const picked = attempt().answers[q.num];
  return `<div class="responses" role="group" aria-label="Options for question ${q.num}" lang="en">${options.map(([value,label]) => {
    const className = !locked || q.num === 22 ? '' : value === q.answer ? 'correct' : picked === value ? 'wrong' : '';
    return `<label class="response ${className}"><input type="radio" name="q${q.num}" data-answer="${q.num}" value="${value}" ${picked === value ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${type === 'choice' ? `<b>${value}.</b> ` : ''}${escape(label)}</span></label>`;
  }).join('')}</div>`;
}
function explanation(q) {
  const score = status(q);
  const selected = attempt().answers[q.num];
  let answer = q.answer;
  if (q.options.length) answer += ' · ' + q.options[letters.indexOf(q.answer)][0];
  if (q.num >= 5 && q.num <= 10) answer += ' · ' + matching[letters.indexOf(q.answer)];
  if (q.num >= 37) answer += ' · ' + wordBank[letters.indexOf(q.answer)];
  const translatedOptions = q.options.length ? `<ul>${q.options.map(([,vi],i) => `<li><b>${letters[i]}.</b> ${escape(vi)}</li>`).join('')}</ul>` : '';
  return `<div class="tags"><span class="tag ${score}">${labels[score]}</span>
    <span class="tag">Your answer ${norm(selected) ? escape(selected) : '—'}</span>
    <span class="tag ${score === 'discuss' ? 'discuss' : 'correct'}">${score === 'discuss' ? 'Handout key' : 'Answer'} · ${escape(answer)}</span></div>
    <details class="explain" data-explain="${q.num}" ${current() === q.num ? 'open' : ''}>
      <summary>Explanation for question ${q.num} · EN / VI</summary>
      <dl>
        <dt>1. Understand the question</dt><dd lang="vi">${escape(q.vi)}${translatedOptions}</dd>
        <dt>2. Keywords and paraphrasing</dt><dd><ul class="paraphrase-list">${q.glosses.map(([prompt,promptVi,passage,passageVi]) =>
          `<li><div><b>${escape(prompt)}</b> = <span lang="vi">${escape(promptVi)}</span></div>
            <div><b>${escape(passage)}</b> = <span lang="vi">${escape(passageVi)}</span></div></li>`).join('')}</ul></dd>
        <dt>3. ${q.context ? 'Related text in the passage' : 'Evidence in the passage'}</dt>
        <dd><blockquote class="${q.context ? 'context' : ''}"><span lang="en">${escape(q.evidence)}</span><span class="translation" lang="vi">${escape(q.evidenceVi)}</span></blockquote>
        <button class="btn" type="button" data-evidence="${q.num}">Find in passage</button></dd>
        <dt>4. Check the answer</dt><dd><p>${escape(q.reasonEn)}</p><p class="translation" lang="vi">${escape(q.reason)}</p></dd>
      </dl>
    </details>`;
}
function flag(q) {
  return view === 'practice' ? `<button type="button" class="flag" data-flag="${q.num}" aria-pressed="${!!attempt().flags[q.num]}" aria-label="Flag question ${q.num}" title="Flag for review">${flagIcon}</button>` : '';
}
const badge = (n) => `<span class="qnum">${n}</span>`;
function questionMarkup(q,type) {
  const pair = q.num === 18 || q.num === 38 ? question(q.num + 1) : null;
  const inline = q.blankLine ? escape(q.blankLine).replace(/\{(\d+)\}/g, (_,n) => {
    const num = Number(n);
    return (num === q.num ? '' : `<span id="q-${num}">${badge(num)}</span>`) + field(question(num),type);
  }) : '';
  const heading = type === 'diagram' ? badge(q.num) :
    `<div class="prompt" lang="en">${badge(q.num)}${inline || escape(q.prompt)}</div>`;
  const input = ['choice','truth','claims'].includes(type) ? choices(q,type) :
    inline ? '' : field(q,type);
  return `<article id="q-${q.num}" class="question ${current() === q.num || current() === pair?.num ? 'active' : ''}" tabindex="-1">
    <div class="qhead">${heading}${flag(q)}${pair ? flag(pair) : ''}</div>${input}
    ${view === 'review' ? explanation(q) + (pair ? explanation(pair) : '') : ''}</article>`;
}
function renderQuestions() {
  $('question-list').innerHTML = groups[index].map(([start,end,title,instruction,guide,type,summary]) => {
    const items = lesson().questions.filter((q) => q.num >= start && q.num <= end && ![19,39].includes(q.num));
    return `<section class="q-group"><header class="instruction">
      <div lang="en" class="eyebrow">Questions ${start}–${end}</div><h3 lang="en">${title}</h3>
      <p>${instruction}</p>${guide ? `<p>${guide}</p>` : ''}
    </header>
    ${type === 'diagram' ? `<figure class="diagram"><img src="${lesson().diagram}" alt="Roller coaster diagram with three blank labels marking parts of the lifting mechanism."><figcaption>Lift hill · Tracks · Start · Lifting mechanism</figcaption></figure>` : ''}
    ${summary ? `<h3 lang="en">${summary}</h3>` : ''}
    ${type === 'match' ? bankMarkup(matching) : type === 'bank' ? bankMarkup(wordBank) : ''}
    <div class="${type === 'diagram' && view === 'practice' ? 'diagram-fields' : ''}">${items.map((q) => questionMarkup(q,type)).join('')}</div></section>`;
  }).join('');
}
function updateControls() {
  const answered = lesson().questions.filter((q) => norm(attempt().answers[q.num])).length;
  const result = view === 'review' ? counts(lesson().questions) : null;
  $('mode').textContent = result ? 'Review explanations' : 'Practice';
  $('evidence-key').hidden = !result;
  $('progress').textContent = result ? `${result.correct}/${lesson().questions.length-result.discuss} correct` : `${answered}/${lesson().questions.length} answered`;
  for (const button of $('numbers').children) {
    const n = Number(button.dataset.number);
    const style = result ? status(question(n)) : norm(attempt().answers[n]) ? 'answered' : '';
    button.className = `navbtn ${style} ${attempt().flags[n] ? 'flagged' : ''}`;
    button.setAttribute('aria-current', n === current() ? 'true' : 'false');
    const detail = [result ? labels[style] : style ? 'Answered' : 'Unanswered',attempt().flags[n] ? 'Flagged' : ''].filter(Boolean).join(', ');
    button.setAttribute('aria-label',`Question ${n}. ${detail}`);
    button.title = detail;
  }
  $('prev').disabled = current() === firstNumber();
  $('next').disabled = current() === lastNumber();
  $('main-action').textContent = result ? 'Results' : 'Submit answers';
}
function jump(n,{focus = true, showPassage = false, scrollPage = false} = {}) {
  if (!question(n)) return;
  attempt().current = n;
  displayPane(showPassage ? 'reading' : 'questions');
  const target = $('q-' + n);
  const article = target.closest('article');
  $('question-list').querySelector('.question.active')?.classList.remove('active');
  article.classList.add('active');
  if ($('question-list').offsetWidth) {
    if (focus) article.focus({preventScroll:true});
    scrollToChild($('question-list'),article);
  }
  if (scrollPage) $('workspace').scrollIntoView({block:'start'});
  if (view === 'review') {
    const details = $('question-list').querySelector(`[data-explain="${n}"]`);
    details.open = true;
    showEvidence(n,showPassage);
    if (target !== article && $('question-list').offsetWidth) scrollToChild($('question-list'),details,8);
  } else if (target !== article && $('question-list').offsetWidth) {
    scrollToChild($('question-list'),target.closest('.qhead'));
  }
  updateControls();
  const nav = $('numbers').querySelector('[aria-current=true]');
  const bounds = $('numbers').getBoundingClientRect();
  if (nav.getBoundingClientRect().right > bounds.right || nav.getBoundingClientRect().left < bounds.left) {
    $('numbers').scrollLeft += nav.getBoundingClientRect().left - bounds.left - 5;
  }
}
function renderResult() {
  const result = counts(lesson().questions);
  const total = lesson().questions.length - result.discuss;
  const correctAngle = result.correct / total * 100;
  const answeredAngle = (result.correct + result.wrong) / total * 100;
  const rows = groups[index].map(([start,end,title]) => {
    const r = counts(lesson().questions.filter((q) => q.num >= start && q.num <= end));
    return `<tr><th scope="row" lang="en">${title}</th><td>${end-start+1-r.discuss}</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.skipped}</td></tr>`;
  }).join('');
  $('results').innerHTML = `<div class="result-grid">
    <section class="result-score"><h2 tabindex="-1" id="result-heading">Results</h2>
    <p>Time spent <strong>${formatTime(attempt().elapsed)}</strong></p>
    <div class="result-summary"><div class="ring" aria-hidden="true" style="--c:${correctAngle}%;--w:${answeredAngle}%">
      <div><b>${result.correct}/${total}</b><span>correct</span></div></div>
      <ul class="legend">
        <li><i style="background:var(--good)"></i>Correct <strong>${result.correct}</strong></li>
        <li><i style="background:var(--bad)"></i>Incorrect <strong>${result.wrong}</strong></li>
        <li><i style="background:#e3cbb8"></i>Skipped <strong>${result.skipped}</strong></li>
        ${result.discuss ? '<li><i style="background:#b4833f"></i>Discussion <strong>1</strong></li>' : ''}
      </ul></div>
    <div class="actions"><button id="review" class="btn primary" type="button">Review explanations</button><button id="reset" class="btn" type="button">Try again</button></div>
    </section>
    <section class="result-detail"><h2>Results by question type</h2>
    <div class="table-wrap"><table><thead><tr><th scope="col">Question type</th><th scope="col">Scored</th><th scope="col">Correct</th><th scope="col">Incorrect</th><th scope="col">Skipped</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${result.discuss ? '<p class="result-note">Question 22 is for discussion and is excluded from the score.</p>' : ''}
    </section></div>`;
}
function render() {
  $('tabs').innerHTML = lessons.map((p,i) => `<button type="button" class="tab" data-lesson="${i}" aria-current="${i===index}"><span class="tab-no">0${i+1}</span><span lang="en">${escape(p.short)}</span></button>`).join('');
  $('theme').textContent = lesson().theme;
  $('title').textContent = lesson().title;
  $('hero-meta').textContent = `Passage ${index+1} · Questions ${firstNumber()}–${lastNumber()}`;
  $('hero-image').src = lesson().image;
  $('home').hidden = view !== 'home';
  $('practice').hidden = view !== 'practice' && view !== 'review';
  $('go-home').setAttribute('aria-current',view === 'home');
  $('go-practice').setAttribute('aria-current',view !== 'home');
  $('reset-passage').textContent = `Reset Passage ${index + 1}`;
  $('results').hidden = view !== 'result';
  updateTime();
  if (view === 'home') return renderHome();
  if (view === 'result') return renderResult();
  $('question-range').textContent = `Questions ${firstNumber()}–${lastNumber()}`;
  $('numbers').innerHTML = lesson().questions.map(({num}) => `<button type="button" data-number="${num}">${num}</button>`).join('');
  renderPassage();
  renderQuestions();
  $('passage').scrollTop = 0;
  $('question-list').scrollTop = 0;
  displayPane(pane);
  updateControls();
}
function confirmAction(title,body,actionLabel,action) {
  const dialog = $('dialog');
  dialog.innerHTML = `<form method="dialog"><h2 id="dialog-title">${escape(title)}</h2><p>${escape(body)}</p>
    <div class="actions"><button class="btn" type="submit" value="cancel" autofocus>Go back</button>
    <button class="btn primary" type="button" id="confirm-action">${escape(actionLabel)}</button></div></form>`;
  $('confirm-action').addEventListener('click', () => { dialog.close(); action(); });
  dialog.showModal();
}
function openNotes() {
  $('dialog').innerHTML = '<form method="dialog"><h2 id="dialog-title">Passage notes</h2><textarea id="notes-field" aria-label="Your notes" placeholder="Write down keywords or anything to revisit…" autofocus></textarea><div class="actions"><button class="btn primary" type="submit">Close</button></div></form>';
  const field = $('notes-field');
  field.value = attempt().notes;
  field.addEventListener('input', () => { attempt().notes = field.value; });
  $('dialog').showModal();
}
function openResult() {
  view = 'result';
  render();
  $('result-heading').focus({preventScroll:true});
  $('results').scrollIntoView({block:'nearest'});
}
$('tabs').addEventListener('click', (event) => {
  const button = event.target.closest('[data-lesson]');
  if (!button || Number(button.dataset.lesson) === index) return;
  pauseClock();
  capturedSelection = null;
  index = Number(button.dataset.lesson);
  if (view !== 'home') view = attempt().submitted ? 'result' : 'practice';
  evidenceNumber = null;
  pane = 'reading';
  beginClock();
  render();
  $('tabs').querySelector('[aria-current=true]').focus({preventScroll:true});
});
$('workspace').addEventListener('focusin',(event) => {
  const input = event.target.closest('[data-answer]');
  if (!input || view !== 'practice') return;
  attempt().current = Number(input.dataset.answer);
  $('question-list').querySelector('.question.active')?.classList.remove('active');
  input.closest('article').classList.add('active');
  beginClock();
  updateControls();
});
$('question-list').addEventListener('input',(event) => {
  const input = event.target.closest('[data-answer]');
  if (!input || view !== 'practice') return;
  attempt().current = Number(input.dataset.answer);
  attempt().answers[input.dataset.answer] = input.value;
  beginClock();
  updateControls();
});
$('question-list').addEventListener('click',(event) => {
  const flagButton = event.target.closest('[data-flag]');
  const evidence = event.target.closest('[data-evidence]');
  if (flagButton) {
    const n = Number(flagButton.dataset.flag);
    attempt().flags[n] = !attempt().flags[n];
    flagButton.setAttribute('aria-pressed',attempt().flags[n]);
    updateControls();
  }
  if (evidence) {
    const n = Number(evidence.dataset.evidence);
    attempt().current = n;
    showEvidence(n,isMobile());
    updateControls();
  }
});
$('question-list').addEventListener('toggle',(event) => {
  if (view !== 'review' || !event.target.open || !event.target.dataset.explain) return;
  const n = Number(event.target.dataset.explain);
  if (n !== current()) {
    attempt().current = n;
    updateControls();
    showEvidence(n);
  }
}, true);
$('mobile').addEventListener('click',(event) => {
  const button = event.target.closest('[data-pane]');
  if (!button) return;
  displayPane(button.dataset.pane);
  if (pane === 'reading' && evidenceNumber !== null) showEvidence(evidenceNumber);
});
$('numbers').addEventListener('click',(event) => {
  const button = event.target.closest('[data-number]');
  if (button) jump(Number(button.dataset.number));
});
$('prev').addEventListener('click', () => jump(current()-1));
$('next').addEventListener('click', () => jump(current()+1));
$('main-action').addEventListener('click',() => {
  if (view === 'review') return openResult();
  const blanks = lesson().questions.filter((q) => q.num !== 22 && !norm(attempt().answers[q.num])).length;
  confirmAction('Submit answers?',blanks ? `Unanswered questions: ${blanks}. These will be counted as skipped.` : 'You can review the answers and evidence after submitting.', 'Submit answers', () => {
    pauseClock();
    attempt().submitted = true;
    openResult();
  });
});
$('results').addEventListener('click',(event) => {
  if (event.target.id === 'review') {
    const missed = lesson().questions.find((q) => status(q) === 'wrong') ||
      lesson().questions.find((q) => status(q) === 'skipped');
    attempt().current = missed?.num || firstNumber();
    view = 'review';
    evidenceNumber = null;
    render();
    jump(current(),{scrollPage:true});
  }
  if (event.target.id === 'reset') resetPassage();
});
function resetPassage() {
  const number = index + 1;
  confirmAction(`Reset Passage ${number}?`,
    'This clears answers, time, flags, notes and highlights for this passage.',
    'Reset passage', () => {
      clockStarted = null;
      attempts[index] = newAttempt();
      translationVisible[index] = false;
      if (view !== 'home') view = 'practice';
      evidenceNumber = null;
      capturedSelection = null;
      pane = 'reading';
      render();
      beginClock();
      $('reset-passage').focus({preventScroll:true});
    });
}
$('reset-passage').addEventListener('click',resetPassage);
$('highlight').addEventListener('pointerdown', () => { capturedSelection = collectSelection(); });
$('highlight').addEventListener('click',toggleMark);
$('clear-marks').addEventListener('click', () => {
  attempt().marks = {};
  const top = $('passage').scrollTop;
  renderPassage();
  $('passage').scrollTop = top;
});
$('notes').addEventListener('click',openNotes);
document.addEventListener('keydown', (event) => {
  if ((view !== 'practice' && view !== 'review') || $('dialog').open || event.ctrlKey || event.metaKey || event.altKey ||
      event.target.matches('input,textarea,select,[contenteditable]')) return;
  if (event.key.toLowerCase() === 'h') { event.preventDefault(); toggleMark(); }
  if (event.key.toLowerCase() === 'n') { event.preventDefault(); openNotes(); }
});
const splitter = $('splitter');
function resize(percent) {
  const value = Math.min(68,Math.max(32,Math.round(percent)));
  $('workspace').style.setProperty('--left', value + 'fr');
  $('workspace').style.setProperty('--right', 100-value + 'fr');
  splitter.setAttribute('aria-valuenow',value);
}
function resizeFromPointer(event) {
  const rect = $('workspace').getBoundingClientRect();
  resize((event.clientX - rect.left) / rect.width * 100);
}
splitter.addEventListener('pointerdown',(event) => {
  splitter.setPointerCapture(event.pointerId);
  resizeFromPointer(event);
});
splitter.addEventListener('pointermove',(event) => {
  if (splitter.hasPointerCapture(event.pointerId)) resizeFromPointer(event);
});
splitter.addEventListener('keydown',(event) => {
  const step = {ArrowLeft:-3, ArrowRight:3}[event.key];
  if (step) {
    event.preventDefault();
    resize(Number(splitter.getAttribute('aria-valuenow'))+step);
  }
});
render();
beginClock();

</script>
