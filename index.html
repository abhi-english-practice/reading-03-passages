:root{color-scheme:light;--desk:#1e1511;--paper:#fbf1e3;--cream:#f4e6d3;--ink:#2f211a;--dim:#654c3c;--brown:#543323;--deep:#372319;--line:#deccb7;--bronze:#bf9569;--good:#25563f;--good-bg:#e7efe6;--bad:#942f3e;--bad-bg:#f8e5e6;--wait:#665950;--wait-bg:#eee6de;--talk:#794913;--talk-bg:#f7e9cc;--shadow:0 12px 30px #0e08063d}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.55 "Open Sans",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a6713f;outline-offset:3px}
h1,h2,h3,p,figure{margin:0}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
.wrap{width:calc(100% - 32px);margin-inline:auto}
.mast{background:#372319;color:#fff7ec;border-bottom:1px solid #654633}
.mast-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.05em;white-space:nowrap}
.brand i{font-style:normal;color:#e4b987}
.mast-label{padding-left:18px;border-left:1px solid #79553e;color:#f5e7d6;font-size:.8rem;font-weight:700;letter-spacing:.095em;text-transform:uppercase}
.identity,.actions,.tools,.mobile,.status-line{display:flex;align-items:center;gap:10px}
.identity{gap:18px}
.timer{font-variant-numeric:tabular-nums;color:#fff7ec;font-weight:700;white-space:nowrap;background:#523729;padding:6px 12px;border:1px solid #79553e;border-radius:7px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:16px 12px}
.tab{display:flex;align-items:center;gap:10px;min-height:47px;padding:8px 13px;text-align:left;background:#f4e6d3;border:1px solid var(--line);border-radius:8px;color:#563928;font-weight:700;line-height:1.25}
.tab[aria-current="true"]{background:var(--deep);color:#fff7ed;border-color:#9d7353}
.tab-no{font-size:.73rem;letter-spacing:.06em;color:var(--brown);padding-right:9px;border-right:1px solid #ccb5a7}
.tab[aria-current="true"] .tab-no{color:#f0c99d;border-color:#956746}
.hero{border:1px solid #684a37;display:grid;grid-template-columns:1fr minmax(180px,30%);overflow:hidden;border-radius:12px;background:#372319;color:white;box-shadow:var(--shadow);min-height:157px}
.hero-copy{padding:22px clamp(18px,3vw,39px);align-self:center}
.eyebrow{font-size:.71rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.hero .eyebrow{color:#f1c79a}
h1{font-size:clamp(1.51rem,3.35vw,2.8rem);line-height:1.13;letter-spacing:-.044em;margin:6px 0 10px}
.hero-meta{color:#f0dfcd;font-size:.84rem}
.hero-figure{position:relative;min-width:0;overflow:hidden}
.hero-figure img{position:absolute;width:100%;height:100%;object-fit:cover}
.control-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mode{font-weight:700;color:#fae6ce}
.status-line{flex-wrap:wrap;gap:5px 11px}
#progress{color:#e4cbb4;font-size:.83rem}
.tools{flex-wrap:wrap;gap:5px 7px}
.btn{border:1px solid var(--line);padding:7px 12px;min-height:36px;border-radius:7px;background:var(--paper);font-weight:700;font-size:.8rem;line-height:1.25}
.btn:hover:not(:disabled),.tab:hover:not([aria-current=true]){background:#efe0d4}
.btn.primary{background:var(--brown);color:white;border-color:var(--brown)}
.btn.primary:hover{background:#6c4431}
.btn.icon{padding-inline:8px;min-width:34px;font-size:1rem}
.btn[aria-pressed=true]{background:#f0e1d5;border-color:#ad8471;color:#4a2c1c}
.mobile{display:none}
.workspace{display:grid;grid-template-columns:minmax(0,var(--left,56fr)) 12px minmax(0,var(--right,44fr));align-items:stretch}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:47px;background:#efdfca;border-bottom:1px solid var(--line);padding:9px 19px;color:#4a2c1c}
.panel-head h2{font-size:.94rem}
.panel-head span{color:var(--dim);font-size:.74rem}
.pane{height:max(410px,calc(100dvh - 405px));overflow:auto;scrollbar-color:#bc9c8e var(--paper);overscroll-behavior:contain;scroll-padding-block:12px}
.passage-text{padding:20px clamp(13px,1.6vw,28px) 27px;font-size:1rem;line-height:1.77}
.passage-text p{margin:0 0 1.05em}
.passage-text h3{margin:7px 0 12px;color:var(--brown);font-size:1.08rem}
#splitter{cursor:col-resize;touch-action:none;display:grid;place-items:center;outline-offset:-1px}
#splitter::before{content:"";height:38px;width:4px;border-radius:5px;background:#b08c6f}
#splitter:hover::before,#splitter:focus-visible::before{background:var(--brown)}
#question-list{padding:13px clamp(12px,2vw,26px) 26px}
.q-group:not(:first-child){margin-top:19px}
.instruction{border:1px solid #e9d9cb;border-left:3px solid #ae7c58;border-radius:6px;background:#f8ebd8;padding:12px 13px;margin-bottom:10px}
.instruction .eyebrow{color:var(--brown)}
.instruction h3{font-size:1.05rem;line-height:1.3;margin:2px 0 6px}
.instruction p{font-size:.84rem}
.question{padding:11px 1px 13px;border-bottom:1px solid #eee3d9;scroll-margin-block:6px}
.question.active{border-left:3px solid #996642;padding-left:8px}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:7px}
.prompt,.filled{line-height:1.63;min-width:0}
.qnum{display:inline-grid;place-items:center;min-width:26px;min-height:25px;vertical-align:baseline;border-radius:6px;background:#efddc6;color:#4e2c19;font-size:.78rem;margin-right:7px;padding-inline:4px;font-weight:700}
.flag{background:transparent;border:1px solid #e4d5ca;border-radius:6px;color:#5e3d2a;min-width:30px;height:30px;padding:2px 5px}
.flag[aria-pressed=true]{background:#f5e3c4;color:#774a0f;border-color:#c59755}
.flag svg{display:block;margin:auto;width:13px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.flag[aria-pressed=true] svg{fill:currentColor}
.responses{display:grid;gap:5px;margin:9px 0 0 33px}
.response{display:flex;align-items:flex-start;gap:9px;border:1px solid #eadfd5;border-radius:7px;background:#fff8ed;padding:6px 9px;cursor:pointer;font-size:.88rem}
.response:has(input:checked){background:#f3e3ce;border-color:#bb8a65}
.response.correct{background:var(--good-bg);border-color:#85a08b;color:var(--good);font-weight:700}
.response.wrong{background:var(--bad-bg);border-color:#c78d99;color:var(--bad)}
.response input{accent-color:var(--brown);margin-top:4px}
.field{width:clamp(95px,35%,160px);padding:3px 6px;border:1px solid #aa8d81;border-radius:5px;background:#fff8ed;vertical-align:baseline;margin:2px 1px;min-height:31px}
.field:disabled{opacity:1;background:#f9eee5;color:var(--ink)}
.field:disabled.correct{background:var(--good-bg);border-color:#789b83;color:var(--good);font-weight:700}
.field:disabled.wrong{background:var(--bad-bg);border-color:#bd8190;color:var(--bad)}
select.field{width:auto;max-width:95%}
.bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 9px;margin-block:7px 10px;padding:10px 13px;background:#f6ead9;border:1px solid var(--line);border-radius:7px;font-size:.85rem}
.bank strong{color:var(--brown);margin-right:5px}
.diagram{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:9px}
.diagram img{display:block;max-width:100%;margin-inline:auto}
.diagram figcaption{padding:7px 9px;font-size:.75rem;border-top:1px solid var(--line);color:var(--dim)}
.diagram-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diagram-fields .field{width:100%;margin:5px 0 0}
.diagram-fields .question.active{padding-left:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:.74rem;font-weight:700;padding:3px 7px;border-radius:5px}
.correct.tag,.navbtn.correct{color:var(--good);background:var(--good-bg);border-color:#9db19e}
.wrong.tag,.navbtn.wrong{color:var(--bad);background:var(--bad-bg);border-color:#d1a3a6}
.skipped.tag,.navbtn.skipped{color:var(--wait);background:var(--wait-bg)}
.discuss.tag,.navbtn.discuss{color:var(--talk);background:var(--talk-bg);border-color:#d3ad72}
.explain{background:#f7ebdc;border:1px solid #e3d1c0;border-radius:8px;margin-top:10px;padding:10px 11px}
.explain summary{font-size:.85rem;font-weight:700;color:var(--brown);cursor:pointer}
.explain dl{margin:9px 0;font-size:.85rem}
.explain dt{font-weight:700;color:#543421;margin-top:8px}
.explain dd{margin:3px 0 0}
.explain blockquote{margin:6px 0;padding:6px 8px;border-left:3px solid #8c4a59;background:#f3e4e4}
.explain blockquote.context{border-color:#aa783e;background:#f5ead6}
.explain .translation{display:block;margin-top:3px;color:var(--dim)}
mark{color:inherit;background:#f9e4a9;border-radius:2px}
mark.evidence{background:#ead1dc;color:#4c1d2e;box-shadow:inset 0 -1px #93576e}
mark.context{background:#f0dfbd;color:#613a17;box-shadow:inset 0 -1px #a97643}
.workbar{position:sticky;bottom:0;z-index:3;margin-top:12px;background:#f2e4d2;border:1px solid #d9c5b7;border-radius:9px;box-shadow:0 -6px 20px #39201a14;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.number-list{display:flex;gap:4px;overflow-x:auto;padding:4px;scrollbar-width:thin}
.navbtn{position:relative;border:1px solid var(--line);background:#fffaf2;border-radius:6px;min-width:29px;height:31px;font-size:.77rem;font-weight:700;padding:2px 5px}
.navbtn.answered{background:#eeddc7;border-color:#b78c69;color:#543421}
.navbtn.flagged:after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;background:#a66b24;border-radius:50%}
.navbtn[aria-current=true]{outline:2px solid var(--brown);outline-offset:1px}
.footer{display:flex;justify-content:center;flex-wrap:wrap;gap:5px 10px;margin-block:16px;padding:12px 10px 8px;color:#dfc8b3;border-top:1px solid #6a4b39;font-size:.75rem;letter-spacing:.025em}
.footer strong{color:#f1cda7}
#notice{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:8px 13px;background:#372319;color:white;border-radius:7px;box-shadow:var(--shadow);font-size:.84rem;pointer-events:none}
#results{margin:14px 0}
.result-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:13px}
.result-score,.result-detail{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:clamp(13px,2vw,23px);box-shadow:var(--shadow)}
.result-score h2,.result-detail h2{color:var(--brown);margin-bottom:9px;font-size:1.15rem}
.result-summary{display:flex;align-items:center;gap:clamp(13px,2.3vw,32px);margin:12px 0}
.ring{display:grid;place-items:center;flex:none;width:133px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--good) 0 var(--c),var(--bad) var(--c) var(--w),#e9d7ca var(--w) 100%)}
.ring>div{display:grid;place-content:center;text-align:center;width:104px;aspect-ratio:1;background:var(--paper);border-radius:50%;line-height:1.2}
.ring b{font-size:1.55rem;color:var(--deep)}
.ring span{font-size:.76rem;color:var(--dim)}
.legend{list-style:none;padding:0;margin:0;font-size:.86rem}
.legend li{margin:4px 0;white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem;text-align:center}
th,td{padding:9px 6px;border-bottom:1px solid var(--line)}
thead th{background:#f4e7db;color:#543421}
th:first-child{text-align:left}
.result-note{font-size:.79rem;color:var(--dim);margin:9px 0}
dialog{width:min(470px,calc(100% - 26px));border:1px solid #d7bbac;border-radius:13px;background:var(--paper);color:var(--ink);padding:18px;box-shadow:0 12px 48px #2c161b55}
dialog::backdrop{background:#1b110db8}
dialog h2{font-size:1.2rem;color:var(--brown);margin-bottom:8px}
dialog p{margin-bottom:11px}
dialog textarea{width:100%;min-height:142px;border:1px solid #bda496;border-radius:7px;padding:8px;background:#fffdf9;resize:vertical}
dialog .actions{justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
@media(max-width:1040px){.result-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}.wrap{width:calc(100% - 24px)}.workbar{gap:5px}.navbtn{min-width:26px}}
@media(max-width:760px){.wrap{width:calc(100% - 16px)}.mast-inner{min-height:50px}.brand{font-size:19px}.mast-label{font-size:.61rem;padding-left:8px}.identity{gap:8px}.timer{font-size:.75rem}.tabs{margin-top:9px;gap:4px}.tab{font-size:.69rem;padding:5px 5px;gap:5px}.tab-no{padding-right:4px;font-size:.61rem}.hero{grid-template-columns:1fr 28%;min-height:114px}.hero-copy{padding:13px 11px}.hero .eyebrow{font-size:.56rem}.hero-meta{font-size:.71rem}.hero-figure figcaption{font-size:.49rem;right:3px;left:3px}.control-row{align-items:flex-start;flex-direction:column;gap:5px;padding:8px 0}.tools{gap:4px}.tools .btn{padding:5px 6px;font-size:.7rem;min-height:30px}.mobile{display:flex;gap:5px;margin:0 0 6px}.mobile .btn{flex:1}.workspace{display:block}.workspace[data-pane=reading] .question-panel,.workspace[data-pane=questions] .reading-panel,#splitter{display:none}.pane{height:max(350px,calc(100dvh - 400px))}.workbar{display:grid;grid-template-columns:1fr;padding:5px;gap:4px;margin-top:7px}.workbar .actions{justify-content:space-between}.workbar .btn{padding-block:5px;min-height:29px}.result-grid{grid-template-columns:1fr}.diagram-fields{gap:4px}.diagram-fields .flag{min-width:23px}.panel-head{min-height:34px;padding:6px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.mode-nav{display:flex;align-items:center;gap:7px;margin:12px 0}
.mode-link{padding-inline:17px}
.mode-link[aria-current=true]{background:var(--deep);color:#fff5e7;border-color:#b58c68}
.mode-link[aria-current=true]:hover{background:#372319}
.home-panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.home-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px clamp(14px,3vw,38px);border-bottom:1px solid var(--line);background:#efdfca}
.home-heading h2{color:#4e301f;font-size:1.15rem}.home-heading p{margin-top:2px;font-size:.84rem;color:var(--dim)}
.home-passage{padding:20px clamp(13px,1.7vw,28px) 27px;font-size:1rem;line-height:1.85}
.home-paragraph{margin-bottom:1.15em}
.home-paragraph h3{font-size:1.14rem;color:#4e301f}
.collocation{appearance:none;border:0;border-radius:3px;padding:0;background:#efddc6;color:#4b2d19;font:inherit;font-weight:700;text-align:left;display:inline;line-height:inherit;text-decoration:underline;text-decoration-color:#a5734a;text-underline-offset:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.collocation:hover,.collocation[aria-expanded=true]{background:#e7c9a8}
.meaning-box{margin-top:7px;background:#f3e3d0;border:1px solid #dcc2a6;border-left:4px solid #91613f;border-radius:6px;padding:10px 12px;font-size:.91rem;line-height:1.55}
.meaning-box b{display:block;color:#543323;margin-bottom:5px}
.meaning-box p+p{margin-top:4px}
.meaning-label{display:inline-block;min-width:8.3rem;font-weight:700;color:#543323}
.paragraph-translation{margin:9px 0 0;padding:8px 11px;border-left:3px solid #ac805e;background:#f3e6d7;color:#543d2e;font-size:.94rem}
.paraphrase-list{list-style:none;margin:6px 0;padding:0}.paraphrase-list li{display:grid;gap:2px;margin-bottom:7px;padding:7px 9px;background:#f3e6d7;border-radius:5px}
.mark-key{color:#266044;font-size:.75rem;font-weight:700}
mark.evidence,mark.context{background:#c0e6c9;color:#17452c;box-shadow:none}
mark.evidence.current,mark.context.current{background:#a2dbb1;box-shadow:inset 0 -2px #36844e}
.explain blockquote,.explain blockquote.context{border-color:#428856;background:#d6efdb;color:#17452c}
@media(max-width:540px){.home-heading{align-items:flex-start;flex-direction:column}.meaning-label{min-width:0;margin-right:6px}.home-passage{line-height:1.75}}
.reset-passage{margin-inline-start:auto;background:#f4e6d3;color:#4e2d1d;border-color:#b89777}
.reset-passage:hover:not(:disabled){background:#ead1b5}
#splitter:hover::before,#splitter:focus-visible::before{background:#e6bb91}
.panel-head .mark-key{color:#266044}

<header class="mast">
 <div class="wrap mast-inner"><div class="identity"><span class="brand">Abhi<i>Uyen</i></span><span class="mast-label">IELTS Reading</span></div><span id="timer" class="timer" aria-label="Time spent">00:00</span></div>

<script type="application/json" id="lesson-data">[{"title": "Living in a Noisy World", "short": "Living in a Noisy World", "theme": "Noise & urban life", "credit": "epSos.de · CC BY 2.0 · Wikimedia Commons", "paras": ["People living in a typical urban environment experience a wide range of sounds on a daily basis. In its Guidelines for Community Noise the World Health Organisation (WHO) declared, Worldwide, noise-induced hearing impairment is the most prevalent irreversible occupational hazard, and it is estimated that 120 million people worldwide now have disabling hearing difficulties.", "The growing noise pollution problem has many different sources. Booming population growth and the loss of rural land to urban sprawl both play a role. Other factors include the inability of authorities in many parts of the world to implement noise-reducing legislation: the electronic nature of our age, which encourages many noisy gadgets; the rising number of vehicles on street, and busier airports.", "Sound intensity is measured in decibels (dB); the unit A-weighted dB (dBA) is used to indicate how humans hear a given sound. Zero dBA is considered the point at which a person begins to hear sound. A soft whisper at three feet equals 30 dBA, a busy freeway at 50 feet is around 80 dBA, and a chainsaw can reach 110 dBA.", "Mark Stephenson, a senior research audiologist at the National Institute for Occupational Safety and Health (NIOSH), says his agency's definition of hazardous noise is sound that exceeds 85 dBA, meaning the average noise exposure measured over a typical eight-hour workday.", "In the United States, about 30 million workers are exposed to hazardous sound levels on the job, according to NIOSH. Noise in the US industry is an extremely difficult problem to monitor, acknowledges Craig Moulton, an industrial hygienist for the Occupational Safety and Health Administration (OSHA). Still, he says, OSHA does require that any employer with staff overexposed to noise safeguard those employees against the harmful impact of noise’.", "‘For many people in the United States, noise has drastically affected the quality of their lives’, says Arline Bronzaft, chair of the Noise Committee of the New York City Council of the Environment, and a psychologist who has done pioneering research on the effects of noise on children's reading ability. 'My daughter lives near La Guardia airport in New York City, and she can't open a window or enjoy her backyard in the summer because of the airplane noise’.", "The United States is not the only country where noise pollution is affecting the quality of life. In Japan noise pollution caused by public loudspeaker announcements and other forms of city noise has forced many Tokyo citizens to wear earplugs as they go about their daily lives. In Europe, about 65% of the population is exposed to ambient sound at levels above 55 dBA, while about 17% is exposed to levels about 65 dBA, according to the European Environment Agency.", "Numerous scientific studies over the years have confirmed that exposure to certain levels of sound can damage hearing. NIOSH studies from the mid to late 1990s show that 90% of coal miners have hearing impairment by age 52- compare to 9% of the general population. NIOSH research also reveals that by age twenty-five, the average carpenter's hearing is equivalent to that of a fifty-year-old male who hasn't been exposed to noise.", "In 2001 researchers from the Center for Disease Control and Prevention reported that, based on audiometric testing of 5,249 children, an estimated 12.5% of American children have noise-induced hearing threshold shifts - or dulled hearing - in one or both ears. Most children with dulled hearing have only limited hearing damage, but continued exposure to excessive noise can lead to difficulties with high-frequency sound discrimination.", "The effects of sound don't stop with the ears. The non-auditory effects of noise were noted as far back as 1930s by a study published by South and D L Laird in the Journal of the Acoustical Society of America. The results showed that exposure to noise caused stomach problems in healthy human beings.", "Noise has also been shown to affect learning ability. In 1975, Bronzaft collaborated on a study of children in a school near a train track that showed how exposure to noise affects reading ability. Half of the students in the study were in classrooms facing the train track and the other half were in classrooms in the school's quieter section. The findings were that students on the quieter side performed better on reading tests.", "Bronzaft and the school principal persuaded the school board to have acoustical tiles installed in the classrooms adjacent to the tracks. The Transit Authority also undertook work on the track near the school in order to reduce noise levels. A follow-up study in 1981 found that children's reading scores improved after these interventions were put in place.", "Anti-noise activists say that Europe and several countries in Asia are more advanced than the United States in terms of combating noise. ‘Population pressure has prompted Europe to move more quickly on the noise issue,’ says Ken Hume, a principal lecturer in human physiology at the Manchester Metropolitan University in England.", "European cities with at least 250,000 people are developing noise maps of those cities to help leaders determine noise pollution strategies. Paris has already prepared its first noise maps.", "The map data will be fed into computer models that will help test the sound impact of new road layouts or buildings before construction begins.", "Bronzaft stresses that governments worldwide need to direct more financial resources towards studies investigating the effects of noise, and do a better job coordinating their noise pollution efforts, so they can establish health and environmental policies based on solid scientific research."], "questions": [{"num": 1, "prompt": "Experts consider noise levels to be harmful if they go above 85 dBA.", "vi": "Các chuyên gia cho rằng mức tiếng ồn có hại nếu vượt quá 85 dBA.", "answer": "85 dBA", "options": [], "keywords": "harmful noise levels = hazardous noise; go above = exceeds", "reason": "NIOSH định nghĩa tiếng ồn nguy hại là mức vượt quá 85 dBA trong ngày làm việc 8 giờ.", "blankLine": "Experts consider noise levels to be harmful if they go above {1}.", "evidence": "hazardous noise is sound that exceeds 85 dBA", "evidenceVi": "Tiếng ồn nguy hại là âm thanh vượt quá 85 dBA.", "context": false, "reasonEn": "NIOSH defines hazardous noise as sound above 85 dBA, averaged over a typical eight-hour workday.", "glosses": [["harmful noise levels", "mức tiếng ồn có hại", "hazardous noise", "tiếng ồn ở mức nguy hại"], ["go above", "vượt quá", "exceeds", "cao hơn một ngưỡng"]]}, {"num": 2, "prompt": "Children with “dulled hearing” may eventually have trouble distinguishing high-frequency sounds.", "vi": "Trẻ bị suy giảm thính lực cuối cùng có thể gặp khó khăn khi phân biệt âm thanh tần số cao.", "answer": "high-frequency", "options": [], "keywords": "have trouble distinguishing = difficulties with ... discrimination; eventually = continued exposure can lead to", "reason": "Tiếp xúc tiếp tục với tiếng ồn quá mức có thể gây khó khăn khi phân biệt âm tần số cao.", "blankLine": "Children with “dulled hearing” may eventually have trouble distinguishing {2} sounds.", "evidence": "continued exposure to excessive noise can lead to difficulties with high-frequency sound discrimination", "evidenceVi": "Việc tiếp tục tiếp xúc với tiếng ồn quá mức có thể gây khó khăn khi phân biệt âm thanh tần số cao.", "context": false, "reasonEn": "The passage links continued exposure to excessive noise with difficulty telling high-frequency sounds apart.", "glosses": [["have trouble distinguishing", "gặp khó khăn khi phân biệt", "difficulties with high-frequency sound discrimination", "khó phân biệt âm thanh tần số cao"], ["eventually", "về sau", "continued exposure can lead to", "tiếp xúc lâu dài có thể dẫn đến"]]}, {"num": 3, "prompt": "Early research into physical effects other than hearing problems revealed that adults may suffer from stomach problems if exposed to noise.", "vi": "Nghiên cứu ban đầu về các tác động thể chất ngoài vấn đề thính giác cho thấy người trưởng thành có thể gặp vấn đề dạ dày nếu tiếp xúc với tiếng ồn.", "answer": "stomach problems", "options": [], "keywords": "physical effects other than hearing = non-auditory effects; suffer from = caused", "reason": "Nghiên cứu từ thập niên 1930 ghi nhận tiếng ồn gây vấn đề dạ dày ở người khỏe mạnh.", "blankLine": "Early research into physical effects other than hearing problems revealed that adults may suffer from {3} if exposed to noise.", "evidence": "exposure to noise caused stomach problems in healthy human beings", "evidenceVi": "Tiếp xúc với tiếng ồn gây ra các vấn đề dạ dày ở người khỏe mạnh.", "context": false, "reasonEn": "The early study found that noise exposure caused stomach problems even in healthy people.", "glosses": [["physical effects other than hearing", "tác động thể chất ngoài thính giác", "non-auditory effects", "tác động ngoài phạm vi thính giác"], ["suffer from stomach problems", "gặp vấn đề về dạ dày", "caused stomach problems", "gây các vấn đề về dạ dày"]]}, {"num": 4, "prompt": "Some European cities are creating noise maps in order to help governments develop noise policies.", "vi": "Một số thành phố châu Âu đang lập bản đồ tiếng ồn nhằm giúp chính quyền xây dựng chính sách về tiếng ồn.", "answer": "noise maps", "options": [], "keywords": "creating = developing; governments = leaders; noise policies = noise pollution strategies", "reason": "Bài đọc nêu bản đồ tiếng ồn giúp lãnh đạo xác định chiến lược chống ô nhiễm tiếng ồn. Đề gốc có thêm “noise policies” trước chỗ trống; đã bỏ cụm lặp để câu đúng ngữ pháp.", "blankLine": "Some European cities are creating {4} in order to help governments develop noise policies.", "evi  lives", "evidenceVi": "Tiếng ồn đã ảnh hưởng nghiêm trọng đến chất lượng cuộc sống của họ.", "context": false, "reasonEn": "Arline Bronzaft says noise has seriously affected people's quality of life and gives her daughter's experience as an example.", "glosses": [["kind of lifestyle", "cách sinh hoạt, lối sống", "quality of their lives", "chất lượng cuộc sống của họ"], ["can affect", "có thể ảnh hưởng", "has drastically affected", "đã ảnh hưởng nghiêm trọng"]]}, {"num": 7, "prompt": "American companies are expected to protect workers from the effects of excessive noise.", "vi": "Các công ty Mỹ được yêu cầu bảo vệ người lao động khỏi tác động của tiếng ồn quá mức.", "answer": "C", "options": [], "keywords": "companies = employer; are expected to = require; protect = safeguard; workers = employees", "reason": "Craig Moulton nêu yêu cầu của OSHA đối với chủ sử dụng lao động.", "evidence": "OSHA does require that any employer with staff overexposed to noise safeguard those employees against the harmful impact of noise", "evidenceVi": "OSHA yêu cầu chủ sử dụng lao động bảo vệ nhân viên bị phơi nhiễm quá mức trước tác hại của tiếng ồn.", "context": false, "reasonEn": "Craig Moulton describes OSHA's requirement that employers protect workers who are exposed to too much noise.", "glosses": [["protect workers", "bảo vệ người lao động", "safeguard those employees", "bảo vệ những nhân viên đó"], ["are expected to", "được yêu cầu làm gì", "OSHA does require", "OSHA thực sự yêu cầu"]]}, {"num": 8, "prompt": "Authorities should increase funding for noise pollution research.", "vi": "Các cơ quan chức năng nên tăng kinh phí nghiên cứu ô nhiễm tiếng ồn.", "answer": "D", "options": [], "keywords": "authorities = governments; increase funding = direct more financial resources; research = studies investigating", "reason": "Bronzaft kêu gọi chính phủ dành thêm nguồn lực tài chính cho nghiên cứu.", "evidence": "governments worldwide need to direct more financial resources towards studies investigating the effects of noise", "evidenceVi": "Chính phủ các nước cần dành thêm nguồn lực tài chính cho các nghiên cứu về tác động của tiếng ồn.", "context": false, "reasonEn": "Bronzaft calls for governments to spend more on research into the effects of noise.", "glosses": [["increase funding", "tăng kinh phí", "direct more financial resources towards", "dành thêm nguồn lực tài chính cho"], ["research", "nghiên cứu", "studies investigating", "các nghiên cứu tìm hiểu về"]]}, {"num": 9, "prompt": "Permanent hearing loss caused by noise is the most commonly occurring danger in the global workplace today.", "vi": "Suy giảm thính lực vĩnh viễn do tiếng ồn là mối nguy phổ biến nhất tại nơi làm việc trên toàn thế giới hiện nay.", "answer": "A", "options": [], "keywords": "permanent = irreversible; most commonly occurring = most prevalent; workplace danger = occupational hazard; global = worldwide", "reason": "Đây là nhận định của WHO trong Guidelines for Community Noise.", "evidence": "noise-induced hearing impairment is the most prevalent irreversible occupational hazard", "evidenceVi": "Suy giảm thính lực do tiếng ồn là mối nguy nghề nghiệp không thể đảo ngược phổ biến nhất.", "context": false, "reasonEn": "The WHO describes irreversible hearing impairment caused by noise as the most common occupational hazard worldwide.", "glosses": [["permanent hearing loss", "suy giảm thính lực vĩnh viễn", "irreversible occupational hazard", "mối nguy nghề nghiệp có hậu quả không thể phục hồi"], ["most commonly occurring", "xảy ra thường xuyên nhất", "most prevalent", "phổ biến nhất"]]}, {"num": 10, "prompt": "Workers in certain occupations in the US have high rates of hearing damage.", "vi": "Người lao động trong một số nghề tại Mỹ có tỷ lệ tổn thương thính lực cao.", "answer": "B", "options": [], "keywords": "certain occupations = coal miners / carpenters; hearing damage = hearing impairment", "reason": "NIOSH dẫn số liệu 90% thợ mỏ than và tình trạng suy giảm thính lực sớm Pw5vZ5pbQyUGRwps9bN+Bq7FKQQtTnX/KC073f8xSvx8TJo1grVu3U5sx83Ew2lHPbj/X9rQ82woVaw+285e/UQ/nvAAZZ7kpEbIkKZaI9Dxu20lkFEvy9mrqij7k2LfO9U5Nj10jqvvznMWfWJHJ4P+H3sWvJgrASrqRxKye/lQGmXpaq0NlaFSneYfUwz6fF3vUXhtCfN+Ygce8eNrbD0JIMcCKKACqASRKOuB7u1OOMkKOV9OJ3Tfgg5qgL3kC0mbJ+IX7CgIomDMQCwJAB5DpmJ3vBCtMfAIo2/5Oyh2QHCxeZB6syD38scmAmAtWcAAcuSGq3sjYuDTbmfEsWMnsYW8plaKSoGwssuSZXAy3ahvgBOF7KyczR4x9NXrIuvfqMC2k5Uf0dGRQFXGC79P+aJxedBCv+bbUwATFyO7AON7VjIhAkhcBRcAM1Zw7i9IE+l28r/tKitQsPB5aGGUYq1wieyton6aHBnnYBIuVHLCcQwHbuqJC/2h5JCpH4sAc4dEoSCqSgHdMuae13AcJzeRW8Hww0ZFwSME3gA6GwtLFVhhxsYXGmV8NDUx//KJJUe80QbGOgoH3puL2KmCARfTnZ767dw6wZ4zzTLzgNVT/rrOfQAAASywattSzPt4LJynYrZgSyV54isTLrwLC1J49XCm4gGkQMk9hAx88umki39F+qYqHP6SiXsR1SNbv2YuM/XGZPvUYPt3gDPCwjsTSxM1+tz4FSSkVMsMvYZP5rrQkrE/kv08HGUoAmmqxeZBLHd/H0i2KGGwLJOv3TUQniREuPVFP8oRhhP01rAA=", "translation": ["Người sống trong môi trường đô thị điển hình hằng ngày tiếp xúc với đủ loại âm thanh. Trong Hướng dẫn về Tiếng ồn Cộng đồng, Tổ chức Y tế Thế giới (WHO) cho biết suy giảm thính lực do tiếng ồn là mối nguy nghề nghiệp không thể phục hồi phổ biến nhất trên thế giới. Ước tính hiện có 120 triệu người trên toàn cầu bị suy giảm thính lực đến mức ảnh hưởng nghiêm trọng đến sinh hoạt.", "Tình trạng ô nhiễm tiếng ồn ngày càng gia tăng và bắt nguồn từ nhiều nguồn khác nhau. Dân số tăng nhanh và đất nông thôn bị thu hẹp do đô thị mở rộng đều góp phần vào vấn đề này. Những yếu tố khác gồm việc chính quyền ở nhiều nơi chưa thể thực thi quy định giảm tiếng ồn, sự phổ biến của các thiết bị điện tử gây ồn, số phương tiện trên đường ngày càng tăng và các sân bay ngày càng nhộn nhịp.", "Cường độ âm thanh được đo bằng đề-xi-ben (dB). Đơn vị đề-xi-ben theo trọng số A (dBA) phản ánh cách tai người cảm nhận một âm thanh nhất định. Mốc 0 dBA được xem là ngưỡng bắt đầu nghe được âm thanh. Tiếng thì thầm nhẹ ở khoảng cách 3 feet tương đương 30 dBA, tiếng đường cao tốc đông xe ở khoảng cách 50 feet vào khoảng 80 dBA, còn tiếng cưa máy có thể lên tới 110 dBA.", "Mark Stephenson, chuyên gia nghiên cứu cấp cao về thính học tại Viện An toàn và Sức khỏe Nghề nghiệp Quốc gia Hoa Kỳ (NIOSH), cho biết cơ quan này định nghĩa tiếng ồn nguy hại là âm thanh vượt quá 85 dBA. Đây là mức tiếp xúc tiếng ồn trung bình đo trong một ngày làm việc tám giờ điển hình.", "Theo NIOSH, khoảng 30 triệu người lao động ở Hoa Kỳ tiếp xúc với mức âm thanh nguy hại tại nơi làm việc. Craig Moulton, chuyên gia vệ sinh lao động tại Cơ quan An toàn và Sức khỏe Nghề nghiệp Hoa Kỳ (OSHA), thừa nhận tiếng ồn trong ngành công nghiệp Hoa Kỳ là vấn đề rất khó giám sát. Dù vậy, ông cho biết OSHA yêu cầu bất kỳ chủ lao động nào có nhân viên tiếp xúc quá mức với tiếng ồn đều phải bảo vệ họ khỏi tác hại của tiếng ồn.", "“Đối với nhiều người ở Hoa Kỳ, tiếng ồn đã ảnh hưởng nghiêm trọng đến chất lượng cuộc sống”, Arline Bronzaft nói. Bà là chủ tịch ủy ban phụ trách tiếng ồn thuộc Hội đồng Môi trường Thành phố New York và là nhà tâm lý học đi đầu trong nghiên cứu tác động của tiếng ồn đối với khả năng đọc của trẻ. “Con gái tôi sống gần sân bay La Guardia ở Thành phố New York. Vào mùa hè, nó chẳng thể mở cửa sổ hay ra sân sau thư giãn vì tiếng máy bay.”", "Chất lượng cuộc sống bị ảnh hưởng bởi ô nhiễm tiếng ồn ở nhiều nước, trong đó có Hoa Kỳ. Tại Nhật Bản, các thông báo qua loa công cộng và những nguồn tiếng ồn đô thị khác khiến nhiều người dân Tokyo phải đeo nút tai khi sinh hoạt hằng ngày. Theo Cơ quan Môi trường châu Âu, khoảng 65% dân số châu Âu tiếp xúc với tiếng ồn môi trường trên 55 dBA, còn khoảng 17% tiếp xúc với mức khoảng 65 dBA.", "Qua nhiều năm, nhiều nghiên cứu khoa học đã xác nhận rằng tiếp xúc với một số mức âm thanh nhất định có thể làm tổn hại thính lực. Các nghiên cứu của NIOSH từ giữa đến cuối thập niên 1990 cho thấy đến tuổi 52, 90% thợ mỏ than bị suy giảm thính lực, so với 9% dân số nói chung. Nghiên cứu của NIOSH còn cho biết ở tuổi 25, thính lực của một thợ mộc trung bình đã tương đương với thính lực của một người đàn ông 50 tuổi chưa từng tiếp xúc với tiếng ồn.", "Năm 2001, dựa trên kết quả đo thính lực của 5.249 trẻ em, các nhà nghiên cứu thuộc Trung tâm Kiểm soát và Phòng ngừa Dịch bệnh ước tính 12,5% trẻ em Mỹ bị thay đổi ngưỡng nghe, tức nghe kém đi, ở một hoặc cả hai tai do tiếng ồn. Phần lớn trẻ có biểu hiện nghe kém chỉ bị tổn thương thính lực ở mức nhẹ, nhưng nếu tiếp tục tiếp xúc với tiếng ồn quá mức, các em có thể khó phân biệt âm thanh tần số cao.", "Âm thanh cũng tác động đến những bộ phận khác ngoài tai. Các tác động của tiếng ồn ngoài phạm vi thính giác đã được ghi nhận từ thập niên 1930, trong một nghiên cứu của South và D. L. Laird đăng trên Tạp chí của Hiệp hội Âm học Hoa Kỳ. Kết quả cho thấy việc tiếp xúc với tiếng ồn gây ra các vấn đề về dạ dày ở người khỏe mạnh.", "Tiếng ồn cũng được chứng minh là ảnh hưởng đến khả năng học tập. Năm 1975, Bronzaft tham gia một nghiên cứu về học sinh tại một trường gần đường ray xe lửa, qua đó cho thấy việc tiếp xúc với tiếng ồn tác động thế nào đến khả năng đọc. Một nửa số học sinh học trong các phòng hướng ra đường ray, nửa còn lại học ở khu vực yên tĩnh hơn của trường. Kết quả cho thấy học sinh ở phía yên tĩnh làm bài kiểm tra đọc tốt hơn.", "Bronzaft và hiệu trưởng đã thuyết phục hội đồng nhà trường cho lắp các tấm cách âm trong những phòng học sát đường ray. Cơ quan giao thông cũng sửa đường ray gần trường để giảm tiếng ồn. Một nghiên cứu theo dõi vào năm 1981 cho thấy điểm đọc của học sinh tăng lên sau khi các biện pháp này được triển khai.", "Các nhà hoạt động chống tiếng ồn cho rằng châu Âu và một số nước châu Á đã đi xa hơn Hoa Kỳ trong việc giảm tiếng ồn. Ken Hume, giảng viên chính về sinh lý học người tại Đại học Manchester Metropolitan ở Anh, nói: “Sức ép dân số đã thúc đẩy châu Âu hành động nhanh hơn trước vấn đề tiếng ồn.”", "Các thành phố châu Âu có từ 250.000 dân trở lên đang lập bản đồ tiếng ồn để giúp lãnh đạo xác định chiến lược ứng phó với ô nhiễm tiếng ồn. Paris đã hoàn thành những bản đồ tiếng ồn đầu tiên của mình.", "Dữ liệu bản đồ sẽ được đưa vào các mô hình máy tính để đánh giá tác động về tiếng ồn của cách bố trí đường phố hoặc công trình mới trước khi khởi công.", "Bronzaft nhấn mạnh rằng chính phủ các nước cần dành thêm nguồn lực tài chính cho các nghiên cứu về tác động của tiếng ồn và phối hợp tốt hơn trong việc xử lý ô nhiễm tiếng ồn. Nhờ đó, họ có thể xây dựng chính sách y tế và môi trường dựa trên các nghiên cứu khoa học vững chắc."], "glossary": [["a wide range of sounds", "many different kinds of sounds", "nhiều loại âm thanh khác nhau"], ["on a daily basis", "every day", "hằng ngày"], ["noise-induced hearing impairment", "hearing loss caused by noise", "suy giảm thính lực do tiếng ồn"], ["occupational hazard", "a danger linked to a job", "mối nguy nghề nghiệp"], ["booming population growth", "a very fast rise in the population", "dân số tăng nhanh"], ["urban sprawl", "the spread of a city into nearby land", "sự mở rộng của đô thị ra vùng lân cận"], ["implement noise-reducing legislation", "put laws that reduce noise into effect", "thực thi quy định giảm tiếng ồn"], ["Sound intensity", "how strong a sound is", "cường độ âm thanh"], ["hazardous noise", "noise loud enough to be harmful", "tiếng ồn ở mức nguy hại"], ["average noise exposure", "the average amount of noise someone is exposed to", "mức tiếp xúc tiếng ồn trung bình"], ["exposed to hazardous sound levels", "subjected to noise at harmful levels", "tiếp xúc với âm thanh ở mức nguy hại"], ["safeguard those employees against the harmful impact of noise", "protect those workers from harm caused by noise", "bảo vệ những nhân viên đó khỏi tác hại của tiếng ồn"], ["quality of their lives", "how comfortable and satisfactory their lives are", "chất lượng cuộc sống của họ"], ["pioneering research", "some of the first research in a field", "nghiên cứu tiên phong"], ["public loudspeaker announcements", "messages played through loudspeakers in public places", "thông báo qua loa công cộng"], ["go about their daily lives", "do the things they usually do each day", "sinh hoạt hằng ngày"], ["damage hearing", "make someone less able to hear", "làm tổn hại thính lực"], ["is equivalent to", "is the same as in level or value", "tương đương với"], ["audiometric testing", "tests that measure how well someone can hear", "đo thính lực"], ["dulled hearing", "a reduced ability to hear clearly", "thính lực suy giảm, nghe kém hơn"], ["continued exposure to excessive noise", "ongoing exposure to noise that is too loud", "tiếp tục tiếp xúc với tiếng ồn quá mức"], ["non-auditory effects", "effects on parts of the body or mind other than hearing", "tác động ngoài phạm vi thính giác"], ["collaborated on a study", "worked together on a research project", "phối hợp thực hiện một nghiên cứu"], ["performed better on reading tests", "got better results in reading tests", "làm bài kiểm tra đọc tốt hơn"], ["acoustical tiles", "panels used to absorb sound or reduce noise", "tấm tiêu âm"], ["undertook work on the track", "carried out work on the railway track", "tiến hành sửa chữa đường ray"], ["a follow-up study", "a later study that checks what happened after the first one", "một nghiên cứu theo dõi sau đó"], ["combating noise", "taking action to reduce noise", "ứng phó với tiếng ồn"], ["population pressure", "strain caused by a large or growing population", "sức ép dân số"], ["developing noise maps", "making maps that show noise levels in different areas", "lập bản đồ tiếng ồn"], ["fed into computer models", "entered into software for analysis or testing", "được đưa vào các mô hình máy tính"], ["new road layouts", "new ways of arranging roads", "cách bố trí đường phố mới"], ["direct more financial resources towards", "put more money into a particular activity", "dành thêm nguồn lực tài chính cho"], ["solid scientific research", "careful, reliable scientific studies", "nghiên cứu khoa học vững chắc"]]}, {"title": "Roller coaster: the great fairground attraction", "short": "Roller Coaster", "theme": "Motion & funfairs", "credit": "Ruth Hartnup · CC BY 2.0 · Wikimedia Commons", "paras": ["How they move", "Like a passenger train, a roller coaster consists of a series of connected cars that move on a track. But unlike a passenger train, it has no engine or power source of its own. For most of the ride, it is moved only by the forces of inertia and gravity. The only exertion of energy occurs at the very beginning of the ride when the coaster train is pulled up the lift hill.", "The traditional lifting mechanism is a long length of chain running up the hill under the track.", "The chain is fastened in a loop, which is wound around a gear at the top of the hill and another one at the bottom of the hill. The gear at the bottom of the hill is turned by a motor. This turns the chain so that it continually moves up the hill like a long conveyor belt. The coaster cars grip onto the chain, which simply pulls them to the top of the hill. At the summit, the train is released and starts its descent.", "The purpose of this initial ascent is to build up a sort of reservoir of potential energy, which simply means that as the coaster gets higher in the air, there is a greater distance gravity can pull it down.", "As the train starts coasting down the hill, this potential energy is converted into kinetic energy (energy of motion), and the train speeds up. At the bottom of the hill, this has reached its maximum, and this propels the train up the second hill, again building up the potential energy level.", "In this way, the course of the track is constantly converting energy from kinetic to potential and back again. This fluctuation in acceleration is what makes roller coasters so much fun. At its most basic level, this is all a roller coaster is - a machine that uses gravity and inertia to send a train along a winding track.", "Coasting through history", "Roller coasters have a long, fascinating history. Their direct ancestors were ice slides, popular in Russia in the 16th and 17th centuries. They consisted of a long, steep, wooden slide covered in ice. Riders walked up a ladder or set of stairs to the top of the slide, as high as 21 metres up. At the top, they climbed into sleds made out of wood or blocks of ice and shot down the slope. At the base of the slide, the sleds would crash-land in a sand pile.", "It seems that the idea was then imported into France. For most of the year, the warmer climate would melt the ice, so the French started building waxed slides instead. To help the sleds move down these slides, they added wheels, and in 1817, for the first time, a train was attached to the track. The French continued to expand on this idea, coming up with more complex track layouts, with multiple cars and all sorts of twists and turns.", "The first American roller coaster was built in the mountains of Pennsylvania in the mid-1800s, originally to provide an easy way to send coal to the railway 29km down the mountain. When the track was first built, a crew at the bottom of the mountain would attach the cart to a team of mules after emptying the load, and the mules would drag it back up to the top. They were eventually replaced with steam engines, to make the system more efficient.", "Soon after these improvements were made, the railway company built a new tunnel that brought the freight trains much closer to the coal mine.", "Now no longer required for its original purpose, the roller coaster was configured as a 'scenic tour’. For one dollar, tourists got a leisurely ride up to the top of the mountain, followed by a wild, bumpy ride straight down. This was soon a resounding success, attracting thousands of tourists every year.", "Scenic rides like this continued to thrive and were joined by wooden roller coasters similar to the ones we know today. These coasters were the main attraction at popular amusement parks throughout the United States, such as the many parks of Coney Island in New York.", "By the 1920s, roller coasters were in full swing, with some 2,000 rides in operation around the country.", "Following the Great Depression, a decline in roller coaster production began in the early 1930s, but a second roller-coaster boom in the 1970s and the beginning of the 1980s revitalised the amusement park industry, and introduced a slew of innovative tubular steel coasters.", "This was followed by a decline in interest for the rest of the decade, but since the early 1990s, the amusement-park industry has experienced another coaster boom of sorts.", "New launching techniques and other technological developments have opened up a world of options for designers, so in some rides you feel as if you are flying. In the next few years we can expect to see many faster, taller and more twisted rides popping up in amusement parks around the world."], "questions": [{"num": 14, "prompt": "Diagram label 14", "vi": "Nhãn 14 trên sơ đồ: bộ phận chạy dọc dốc nâng.", "answer": "chain", "options": [], "keywords": "lifting mechanism under the track = chain running up the hill", "reason": "Xích chạy dưới đường ray, kéo các toa lên đỉnh dốc.", "evidence": "a long length of chain running up the hill under the track", "evidenceVi": "Một sợi xích dài chạy lên dốc bên dưới đường ray.", "context": false, "reasonEn": "The passage names the chain as the part that runs up the hill beneath the track and pulls the train up.", "glosses": [["lifting mechanism under the track", "bộ phận kéo tàu lên dốc, nằm dưới đường ray", "chain running up the hill", "dây xích chạy dọc theo dốc lên"]]}, {"num": 15, "prompt": "Diagram label 15", "vi": "Nhãn 15 trên sơ đồ: bộ phận dạng bánh răng.", "answer": "gear", "options": [], "keywords": "wheel-like component = gear; chain is wound around it", "reason": "Dây xích quấn quanh bánh răng ở đỉnh và chân dốc.", "evidence": "wound around a gear at the top of the hill and another one at the bottom of the hill", "evidenceVi": "Quấn quanh một bánh răng ở đỉnh dốc và một bánh răng khác ở chân dốc.", "context": false, "reasonEn": "The chain loops àn tàu được nhả ra và bắt đầu lao xuống.", "Mục đích của lần leo dốc đầu tiên là tích trữ thế năng. Nói đơn giản, tàu lượn càng lên cao thì quãng đường mà trọng lực có thể kéo nó xuống càng dài.", "Khi đoàn tàu bắt đầu trượt xuống dốc, thế năng chuyển thành động năng, tức năng lượng của chuyển động, khiến tàu tăng tốc. Ở chân dốc, động năng đạt cực đại và đẩy đoàn tàu lên ngọn dốc thứ hai, làm thế năng tăng trở lại.", "Theo cách đó, đường ray liên tục giúp chuyển hóa động năng thành thế năng rồi ngược lại. Sự thay đổi gia tốc này tạo nên cảm giác thú vị của tàu lượn. Về cơ bản, tàu lượn là một cỗ máy sử dụng trọng lực và quán tính để đưa đoàn tàu chạy trên đường ray uốn lượn.", "Lịch sử tàu lượn", "Tàu lượn siêu tốc có một lịch sử lâu đời và thú vị. Tiền thân trực tiếp của chúng là các máng trượt băng phổ biến ở Nga vào thế kỷ 16 và 17. Mỗi máng là một dốc gỗ dài và đứng, bên trên phủ băng. Người chơi leo thang hoặc bậc lên đỉnh máng, có nơi cao tới 21 mét. Tại đó, họ ngồi vào xe trượt làm bằng gỗ hoặc bằng khối băng rồi lao xuống dốc. Ở chân máng, xe trượt lao vào một đống cát để dừng lại.", "Có vẻ ý tưởng này sau đó được đưa vào Pháp. Ở đây, khí hậu ấm hơn khiến băng tan trong phần lớn thời gian trong năm, nên người Pháp chuyển sang làm máng trượt phủ sáp. Họ gắn bánh xe để xe trượt xuống máng dễ hơn. Năm 1817, lần đầu tiên một đoàn tàu được gắn vào đường ray. Người Pháp tiếp tục phát triển ý tưởng này và thiết kế những tuyến đường ray phức tạp hơn, với nhiều toa và đủ kiểu khúc quanh.", "Tàu lượn đầu tiên của Hoa Kỳ được xây ở vùng núi Pennsylvania vào giữa thế kỷ 19, ban đầu để thuận tiện đưa than xuống tuyến đường sắt cách đó 29 km theo đường xuống núi. Khi đường ray mới được xây, công nhân dưới chân núi dỡ than xong sẽ nối xe goòng vào một đàn la, để chúng kéo xe trở lại đỉnh. Về sau, người ta thay sức kéo của la bằng động cơ hơi nước để hệ thống hoạt động hiệu quả hơn.", "Không lâu sau những cải tiến này, công ty đường sắt xây một đường hầm mới để tàu chở hàng có thể đến gần mỏ than hơn nhiều.", "Khi không còn phục vụ mục đích ban đầu, tuyến tàu được cải tạo thành một chuyến tham quan ngắm cảnh. Với một đô la, du khách được thong thả đi lên đỉnh núi rồi lao thẳng xuống trong một hành trình dằn xóc đầy phấn khích. Dịch vụ này nhanh chóng thành công vang dội và thu hút hàng nghìn du khách mỗi năm.", "Những chuyến ngắm cảnh như thế tiếp tục phát triển, đồng thời xuất hiện thêm các tàu lượn bằng gỗ tương tự loại chúng ta biết ngày nay. Tàu lượn trở thành điểm thu hút chính ở các công viên giải trí nổi tiếng khắp Hoa Kỳ, chẳng hạn các công viên ở Coney Island, New York.", "Đến thập niên 1920, tàu lượn siêu tốc rất thịnh hành, với khoảng 2.000 trò tàu lượn đang hoạt động trên khắp Hoa Kỳ.", "Sau cuộc Đại Suy thoái, việc chế tạo tàu lượn bắt đầu suy giảm vào đầu thập niên 1930. Tuy nhiên, làn sóng bùng nổ thứ hai vào thập niên 1970 và đầu thập niên 1980 đã vực dậy ngành công viên giải trí và đưa vào sử dụng hàng loạt tàu lượn dùng đường ray thép hình ống có thiết kế mới.", "Mối quan tâm sau đó suy giảm trong phần còn lại của thập niên 1980, nhưng từ đầu thập niên 1990, ngành công viên giải trí lại chứng kiến một đợt bùng nổ tàu lượn khác.", "Các kỹ thuật phóng tàu mới cùng những tiến bộ công nghệ khác mở ra nhiều lựa chọn cho nhà thiết kế, đến mức ở một số trò bạn có cảm giác như đang bay. Trong vài năm tới, nhiều tàu lượn nhanh hơn, cao hơn và có nhiều đoạn xoắn hơn có thể xuất hiện tại các công viên giải trí trên thế giới."], "glossary": [["a series of connected cars", "several train cars joined together", "một dãy toa nối với nhau"], ["power source of its own", "something that supplies its own power", "nguồn năng lượng riêng"], ["forces of inertia and gravity", "the tendency to keep moving and the force that pulls things down", "quán tính và lực hấp dẫn"], ["pulled up the lift hill", "drawn to the top of the first slope", "được kéo lên dốc nâng"], ["lifting mechanism", "the parts that pull the train up the hill", "cơ cấu kéo tàu lên dốc"], ["chain running up the hill", "a chain that goes up along the slope", "dây xích chạy dọc theo dốc lên"], ["fastened in a loop", "joined at the ends to form a ring", "được nối thành vòng kín"], ["wound around a gear", "wrapped around a toothed wheel", "quấn quanh một bánh răng"], ["starts its descent", "begins moving down", "bắt đầu lao xuống"], ["build up a sort of reservoir of potential energy", "store energy by moving the train higher", "tích trữ thế năng khi kéo tàu lên cao"], ["coasting down the hill", "rolling down the slope without engine power", "trượt xuống dốc mà không cần động cơ"], ["converted into kinetic energy", "changed into the energy of movement", "được chuyển thành động năng"], ["fluctuation in acceleration", "changes in how quickly the train speeds up or slows down", "sự thay đổi gia tốc"], ["a winding track", "a track with many bends", "đường ray uốn lượn"], ["direct ancestors", "earlier forms that developed into something later", "tiền thân trực tiếp"], ["shot down the slope", "went down the slope very quickly", "lao nhanh xuống dốc"], ["was then imported into France", "was then brought to France from another country", "sau đó được đưa vào Pháp"], ["building waxed slides", "making slides with a layer of wax on top", "làm máng trượt phủ sáp"], ["twists and turns", "many bends and changes of direction", "những đoạn uốn lượn và đổi hướng"], ["attach the cart to a team of mules", "connect the cart to a group of mules so they can pull it", "nối xe goòng vào một đàn la để kéo"], ["replaced with steam engines", "swapped for engines that run on steam", "được thay bằng động cơ hơi nước"], ["freight trains", "trains that carry goods", "tàu chở hàng"], ["a leisurely ride", "a slow and relaxed trip", "chuyến đi thong thả"], ["a resounding success", "something that succeeds extremely well", "một thành công vang dội"], ["main attraction", "the thing that draws the most visitors", "điểm thu hút chính"], ["in full swing", "very active or at a busy stage", "đang rất thịnh hành"], ["in operation", "working and in use", "đang hoạt động"], ["a second roller-coaster boom", "a second period of rapid growth for roller coasters", "đợt bùng nổ tàu lượn lần thứ hai"], ["a decline in interest", "a drop in how much people care about something", "sự suy giảm mức độ quan tâm"], ["a world of options", "a very wide range of choices", "rất nhiều lựa chọn"], ["popping up", "appearing in different places", "xuất hiện ở nhiều nơi"]]}, {"title": "The value of research into mite harvestmen", "short": "Mite Harvestmen", "theme": "Nature & continental drift", "credit": "Marshal Hedin · CC BY 2.0 · Wikimedia Commons", "paras": ["Few people have heard of the mite harvestman, and fewer still would recognize it at close range. The insect is a relative of the far more familiar daddy longlegs. But its legs are stubby rather than long, and its body is only as big as a sesame seed. To find mite harvestmen, scientists go to dark, humid forests and sift through the leaf litter. The animals respond by turning motionless, making them impossible for even a trained eye to pick out.' They look like grains of dirt.’ said Gonzalo Giribet, an invertebrate biologist at Harvard University", "Dr Giribet and his colleagues have spent six years searching for mite harvestmen on five continents. The animals have an extraordinary story to tell they carry a record of hundreds of millions of years of geological history, chronicling the journeys that continents have made around the Earth. The Earth's landmasses have slowly collided and broken apart again several times, carrying animals and plants with them. These species have provided clues to the continents’ paths.", "The notion of continental drift originally came from such clues. In 1911, the German scientist Alfred Wegener was struck by the fact that fossils of similar animals and plants could be found on either side of the Atlantic. The ocean was too big for the species to have traveled across it on their own. Wegener speculated correctly, as it turned out that the surrounding continents had originally been welded together in a single landmass, which he called Pangea.", "Continental drift, or plate tectonics as it is scientifically known, helped move species around the world. Armadillos and their relatives are found in South America and Africa today because their ancestors evolved when the continents were joined. When South America and North America connected a few million years ago, armadillos spread north, too.", "Biogeographers can learn clues about continental drift by comparing related species. However, they must also recognize cases where species have spread for other reasons, such as by crossing great stretches of water. The island of Hawaii, for example, was home to a giant flightless goose that has become extinct. Studies on DNA extracted from its bones show that it evolved from the Canada goose. Having colonized Hawaii, it branched off from that species, losing its ability to fly. This evolution occurred half a million years ago, when geologists estimate that Hawaii emerged from the Pacific.", "When species jump around the planet, their histories blur. It is difficult to say much about where cockroaches evolved, for example, because they can move quickly from continent to continent. This process, known as dispersal, limits many studies. 'Most of them tend to concentrate on particular parts of the world.’ Dr Giribet said. I wanted to find a new system for studying biogeography on a global scale.", "Dr Giribet realized that mite harvestmen might be that system. The 5,000 or so mite harvestmen species can be found on every continent except Antarctica. Unlike creatures found around the world like cockroaches, mite harvestmen cannot disperse well. The typical harvestman species has a range of fewer than 50 miles. Harvestmen are not found on young islands like Hawaii, as these types of islands emerged long after the break-up of Pangea.", "According to Assistant Professor Sarah Boyer, a former student of Dr Giribet. 'It's really hard to find a group of species that is distributed all over the world but that also doesn't disperse very far.' What mite harvestmen lack in mobility, they make up in age. Their ancestors were among the first land animals, and fossils of daddy longlegs have been found in 400 million-year-ago rocks.", "Mite harvestmen evolved long before Pangea broke up and have been carried along by continental drift ever since they've managed to get themselves around the world only because they’ve been around for hundreds of millions of years, Dr Boyer said. Dr Boyer, Dr Giribet and their colleagues have gathered thousands of mite harvestmen from around the world, from which they extracted DNA. Variations in the genes helped the scientists build an evolutionary tree. By calculating how quickly the DNA mutated, the scientists could estimate when lineages branched off. They then compared the harvestmen's evolution to the movements of the continents. 'The patterns are remarkably clear.' Dr Boyer said.", "The scientists found that they could trace mite harvestmen from their ancestors on Pangea. One lineage includes species in Chile South Africa, Sri Lanka and other places separated by thousands of miles of ocean. But 150 million years ago, all those sites were in Gondwana which was a region of Pangea.", "The harvestmen preserve smaller patterns of continental drift, as well as bigger ones. After analyzing the DNA of a Florida harvestman, Metasiro americanus, the scientists were surprised to find that it was not related to other North American species. Its closest relatives live in West Africa. Dr Boyer then began investigating the geological history of Florida and found recent research to explain the mystery. Florida started out welded to West Africa near Senegal. North America than collied into them Pangea was forming. About 170 million years ago, North America ripped away from West Africa, taking Florida with it. The African ancestors of Florida’s harvestmen came along the ride.", "Dr Giribet now hopes to study dozens or even hundreds of species, to find clues about plate tectonics that a single animal could not show."], "questions": [{"num": 27, "prompt": "Why is it difficult to find mite harvestmen?", "vi": "Tại sao khó tìm thấy mite harvestmen (nhóm bọ chân dài nhỏ)?", "answer": "C", "options": [["They are too small to see with naked eye.", "Chúng quá nhỏ để nhìn bằng mắt thường."], ["They can easily be confused with daddy longlegs.", "Chúng dễ bị nhầm với bọ chân dài thông thường."], ["They are hard to distinguish from their surroundings.", "Chúng khó phân biệt với môi trường xung quanh."], ["They do not exist in large numbers in any one place.", "Chúng không tồn tại với số lượng lớn ở bất kỳ nơi nào."]], "keywords": "hard to distinguish from surroundings = look like grains of dirt; pick out = distinguish", "reason": "C đúng: chúng bất động và trông như hạt đất. A nói tuyệt đối không thể thấy bằng mắt thường; B nhầm với loài họ hàng; D không có căn cứ.", "evidence": "They look like grains of dirt", "evidenceVi": "Chúng trông như những hạt đất.", "context": false, "reasonEn": "The animals lie still and look like grains of dirt, which makes them difficult to spot among their surroundings.", "glosses": [["hard to distinguish from their surroundings", "khó nhận ra giữa những thứ xung quanh", "look like grains of dirt", "trông như những hạt đất"], ["identify", "nhận ra", "pick out", "nhìn ra giữa những thứ khác"]]}, {"num": 28, "prompt": "Why are mite harvestmen of interest to Dr Giribet and his colleagues?", "vi": "Tại sao mite harvestmen thu hút sự quan tâm của Tiến sĩ Giribet và đồng nghiệp?", "answer": "D", "options": [["They have been studied far less than most other species.", "Chúng được nghiên cứu ít hơn nhiều so với phần lớn loài khác."], ["They show the effects of climate on the evolution of animals.", "Chúng cho thấy ảnh hưởng của khí hậu đối với sự tiến hóa của đ ịch chuyển theo đường nào.", "Khái niệm trôi dạt lục địa ban đầu xuất phát từ những dấu vết như vậy. Năm 1911, nhà khoa học Đức Alfred Wegener đặc biệt chú ý khi biết rằng hóa thạch của những động thực vật tương tự nhau được tìm thấy ở hai bờ Đại Tây Dương. Đại dương quá rộng để những loài đó có thể tự vượt qua. Suy đoán của Wegener hóa ra đúng. Các lục địa xung quanh Đại Tây Dương ban đầu từng liền với nhau thành một khối đất liền duy nhất mà ông gọi là Pangea.", "Sự trôi dạt lục địa, được bài đọc gọi theo thuật ngữ khoa học là kiến tạo mảng, góp phần đưa các loài đi khắp thế giới. Ngày nay, thú tatu và những loài họ hàng có mặt ở Nam Mỹ và châu Phi vì tổ tiên chúng tiến hóa khi hai lục địa còn nối liền. Khi Nam Mỹ và Bắc Mỹ nối với nhau cách đây vài triệu năm, thú tatu cũng từ đó lan lên phía bắc.", "Các nhà địa sinh học có thể tìm manh mối về sự trôi dạt lục địa bằng cách so sánh các loài có họ hàng. Tuy nhiên, họ cũng phải nhận ra khi các loài phát tán vì những lý do khác, chẳng hạn vượt qua những vùng nước rộng. Ví dụ, Hawaii từng là nơi sinh sống của một loài ngỗng khổng lồ không biết bay, nay đã tuyệt chủng. Nghiên cứu DNA lấy từ xương cho thấy loài này tiến hóa từ ngỗng Canada. Sau khi đến định cư ở Hawaii, nó tách thành một nhánh riêng và mất khả năng bay. Sự tiến hóa này diễn ra cách đây nửa triệu năm, vào khoảng thời điểm các nhà địa chất ước tính Hawaii nhô lên khỏi Thái Bình Dương.", "Khi các loài di chuyển nhanh giữa nhiều nơi trên thế giới, lịch sử của chúng trở nên khó lần theo. Chẳng hạn, khó xác định gián đã tiến hóa ở đâu vì chúng có thể di chuyển nhanh từ lục địa này sang lục địa khác. Quá trình này được gọi là sự phát tán và gây hạn chế cho nhiều nghiên cứu. Tiến sĩ Giribet nói: “Phần lớn nghiên cứu thường tập trung vào những vùng cụ thể. Tôi muốn tìm một hệ thống mới để nghiên cứu địa sinh học trên quy mô toàn cầu.”", "Tiến sĩ Giribet nhận ra rằng bọ chân dài tí hon có thể là nhóm thích hợp cho cách nghiên cứu đó. Khoảng 5.000 loài thuộc nhóm này có mặt trên tất cả các lục địa trừ Nam Cực. Khác với những sinh vật phân bố khắp nơi như gián, chúng có khả năng phát tán hạn chế. Một loài điển hình có phạm vi phân bố dưới 50 dặm. Người ta không tìm thấy chúng trên những đảo trẻ như Hawaii, vì các đảo này hình thành rất lâu sau khi Pangea tan rã.", "Phó giáo sư Sarah Boyer, học trò cũ của Tiến sĩ Giribet, cho biết: “Rất khó tìm một nhóm loài vừa phân bố khắp thế giới vừa không có khả năng phát tán xa.” Bọ chân dài tí hon tuy di chuyển hạn chế nhưng đã tồn tại rất lâu. Tổ tiên chúng nằm trong nhóm động vật đầu tiên sống trên cạn, và hóa thạch của bọ chân dài đã được tìm thấy trong các lớp đá có niên đại 400 triệu năm.", "Bọ chân dài tí hon tiến hóa từ rất lâu trước khi Pangea tan rã và được các lục địa mang theo khi chúng dịch chuyển. Theo Tiến sĩ Boyer, chúng có mặt khắp thế giới nhờ đã tồn tại hàng trăm triệu năm. Tiến sĩ Boyer, Tiến sĩ Giribet và các đồng nghiệp thu thập hàng nghìn mẫu từ nhiều nơi để tách chiết DNA. Những khác biệt về gene giúp họ dựng một cây tiến hóa. Dựa vào tốc độ đột biến DNA, họ ước tính thời điểm các dòng tiến hóa tách nhánh rồi đối chiếu quá trình tiến hóa của nhóm bọ này với sự dịch chuyển của các lục địa. “Các quy luật hiện ra rõ rệt”, Tiến sĩ Boyer nói.", "Các nhà khoa học nhận thấy họ có thể lần theo nguồn gốc của bọ chân dài tí hon về tới tổ tiên sống trên Pangea. Một dòng tiến hóa gồm các loài ở Chile, Nam Phi, Sri Lanka và những nơi khác hiện cách nhau hàng nghìn dặm biển. Nhưng 150 triệu năm trước, tất cả những nơi này đều thuộc Gondwana, một phần của Pangea.", "Bọ chân dài còn lưu giữ dấu vết của cả những biến động lớn và nhỏ trong quá trình trôi dạt lục địa. Khi phân tích DNA của loài Metasiro americanus ở Florida, các nhà khoa học ngạc nhiên vì nó không có họ hàng với các loài Bắc Mỹ khác. Họ hàng gần nhất của nó sống ở Tây Phi. Tiến sĩ Boyer tìm hiểu lịch sử địa chất của Florida và tìm được nghiên cứu gần đây giúp giải đáp điều bí ẩn. Ban đầu Florida nối với Tây Phi, gần Senegal. Bắc Mỹ sau đó va vào khu vực này khi Pangea đang hình thành. Khoảng 170 triệu năm trước, Bắc Mỹ tách khỏi Tây Phi và mang theo Florida. Tổ tiên gốc châu Phi của bọ chân dài Florida cũng theo đó dịch chuyển.", "Tiến sĩ Giribet hiện hy vọng sẽ nghiên cứu hàng chục, thậm chí hàng trăm loài để tìm ra những manh mối về kiến tạo mảng mà việc nghiên cứu một loài riêng lẻ không thể làm sáng tỏ."], "glossary": [["at close range", "from very near", "ở cự ly gần"], ["sift through the leaf litter", "search through the fallen leaves on the forest floor", "sàng lớp lá rụng trên nền rừng"], ["a trained eye", "someone who can notice small details because of experience", "con mắt nhà nghề"], ["pick out", "notice or identify among other things", "nhận ra giữa những thứ xung quanh"], ["a record of hundreds of millions of years of geological history", "evidence showing how Earth changed over hundreds of millions of years", "dấu tích của hàng trăm triệu năm lịch sử địa chất"], ["provided clues to", "gave information that helped explain", "cung cấp manh mối về"], ["was struck by the fact that", "was surprised or impressed to learn that", "đặc biệt chú ý khi biết rằng"], ["on either side of the Atlantic", "on both sides of the Atlantic Ocean", "ở hai bờ Đại Tây Dương"], ["welded together in a single landmass", "joined to form one large piece of land", "nối liền thành một khối đất liền duy nhất"], ["continental drift", "the slow movement of continents over time", "sự trôi dạt lục địa"], ["the continents were joined", "the continents were connected to each other", "các lục địa còn nối liền"], ["crossing great stretches of water", "travelling across large areas of water", "vượt qua những vùng nước rộng"], ["branched off from that species", "developed separately from the original species", "tách thành một nhánh riêng từ loài đó"], ["losing its ability to fly", "becoming unable to fly", "mất khả năng bay"], ["their histories blur", "their origins become harder to trace", "lịch sử phát
